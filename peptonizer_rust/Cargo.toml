[package]
name = "peptonizer_rust"
version = "0.1.0"
publish = false
edition = "2024"

[lib]
name = "peptonizer_rust"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
csv = "1.1"
petgraph = { version = "0.6", features = ["serde-1"] }
minidom = "0.15"
rustfft = { version = "6.2.0", features = ["wasm_simd"] }
console_error_panic_hook = "0.1"
rand = "0.8"
priority-queue = "2.7.0"
ordered-float = "4.2"
fast-math = "0.1"
nori_inference = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ['Headers', 'Request', 'RequestInit', 'RequestMode', 'Response', 'Window', 'XmlHttpRequest'] }
js-sys = "0.3.76"
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }

