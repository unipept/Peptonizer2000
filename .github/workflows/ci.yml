name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peptonizer_rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  rust-test:
    name: Rust test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peptonizer_rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: cargo test

  ts-lint:
    name: TypeScript lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peptonizer_ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: peptonizer_ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  ts-test:
    name: TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'

      - name: Build WASM package
        working-directory: peptonizer_rust
        run: wasm-pack build --target web --out-dir ../peptonizer_ts/pkg

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: peptonizer_ts/package-lock.json

      - name: Install dependencies
        working-directory: peptonizer_ts
        run: npm ci

      - name: Build
        working-directory: peptonizer_ts
        run: npm run build

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check snakemake/workflow/scripts
