name: Build Wheels

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'peptonizer_rust/dist/**'

  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86
            runs-on: ubuntu-latest
            python-version: "3.12"
          - name: windows-x86
            runs-on: windows-latest
            python-version: "3.12"
          - name: macos-arm
            runs-on: macos-latest
            python-version: "3.12"
          - name: macos-x86
            runs-on: macos-26-intel
            python-version: "3.12"
          - name: linux-arm
            runs-on: ubuntu-24.04-arm
            python-version: "3.12"

    runs-on: ${{ matrix.runs-on }}

    defaults:
      run:
        working-directory: peptonizer_rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TEMP DEBUG - verify checked out source
        run: |
          echo "HEAD commit: $(git rev-parse HEAD)"
          echo "Grepping lib.rs for the relevant symbol names:"
          grep -n "cluster_effects_py\|cluster_taxa_py" src/lib.rs || echo "NEITHER FOUND"
        shell: bash

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: auto
          working-directory: peptonizer_rust
          args: --release --out dist -i python3.12

      - name: TEMP DEBUG - inspect just-built wheel
        run: |
          echo "Files in dist:"
          ls -la dist/*.whl
          for w in dist/*.whl; do
            echo "=== $w ==="
            unzip -l "$w"
            unzip -p "$w" '*.so' '*.pyd' 2>/dev/null | strings -a | grep -o "cluster_effects_py\|cluster_taxa_py" | sort -u
          done
        shell: bash

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: peptonizer_rust/dist/*.whl

  commit-wheels:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy wheels into repo
        run: |
          rm -f peptonizer_rust/dist/*.whl
          mkdir -p peptonizer_rust/dist
          find artifacts -name "*.whl" -print -exec cp {} peptonizer_rust/dist/ \;

          count=$(find peptonizer_rust/dist -name "*.whl" | wc -l)
          echo "Copied $count wheel(s) into peptonizer_rust/dist"
          if [ "$count" -ne 5 ]; then
            echo "::error::Expected 5 wheels (one per matrix platform), found $count. Not committing a partial set."
            exit 1
          fi

      - name: Commit wheels
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f peptonizer_rust/dist/*.whl

          git commit -m "Update wheels [skip ci]" || echo "Generate wheel files"

          git push origin HEAD:${GITHUB_REF#refs/heads/}
