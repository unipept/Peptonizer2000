version: 2
updates:
- package-ecosystem: npm
  directory: "/peptonizer_ts"
  target-branch: development
  schedule:
    interval: monthly
    time: "13:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
- package-ecosystem: cargo
  directory: "/peptonizer_rust"
  target-branch: development
  schedule:
    interval: monthly
    time: "13:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
- package-ecosystem: github-actions
  directory: "/"
  target-branch: development
  schedule:
    interval: monthly
    time: "13:00"
    timezone: Europe/Brussels
  open-pull-requests-limit: 99
